<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    
    <!-- Primary SEO Metadata -->
    <title>EduStride ERP & LMS Portal - Next-Gen School Management Suite</title>
    <meta name="description" content="EduStride is an enterprise-grade ERP and LMS portal for modern academic institutions. Features secure tuition fee ledgers, automated workflows, dynamic progress-based roll numbering, and collaborative class chats." />
    <meta name="keywords" content="EduStride, School ERP, Learning Management System, LMS Portal, School Management Software, Tuition Ledger, Class Chat, Student Information System, Academic Suite" />
    <meta name="author" content="manindra.in" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EduStride ERP & LMS Portal" />
    <meta property="og:description" content="Enterprise school management system with secure tuition ledger, progress-based roll numbers, automated schedules, and real-time class chats." />
    <meta property="og:image" content="/logo.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:title" content="EduStride ERP & LMS Portal" />
    <meta property="twitter:description" content="Enterprise school management system with secure tuition ledger, progress-based roll numbers, automated schedules, and real-time class chats." />
    <meta property="twitter:image" content="/logo.jpg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;850&display=swap" rel="stylesheet">
  </head>
  <body class="bg-dark-950 text-slate-100 antialiased font-sans min-h-screen">
    <div id="root">
      <!-- HTML/CSS static preloader during JS bundle download -->
      <style>
        .initial-preloader-container {
          position: fixed;
          inset: 0;
          background: #050507;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 9999;
          overflow: hidden;
          font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
          color: #f1f5f9;
          user-select: none;
        }
        .initial-aura {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: 500px;
          height: 500px;
          border-radius: 50%;
          background: rgba(99, 102, 241, 0.12);
          filter: blur(160px);
          pointer-events: none;
        }
        .initial-unit {
          position: relative;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          max-width: 384px;
          width: 100%;
          padding: 0 24px;
          box-sizing: border-box;
          text-align: center;
        }
        .initial-logo-wrapper {
          position: relative;
          margin-bottom: 20px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .initial-logo-glow {
          position: absolute;
          inset: 0;
          border-radius: 16px;
          background: rgba(99, 102, 241, 0.25);
          filter: blur(20px);
        }
        .initial-logo-box {
          position: relative;
          z-index: 10;
          width: 64px;
          height: 64px;
          padding: 4px;
          border-radius: 16px;
          background: rgba(11, 13, 19, 0.9);
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 20px 40px rgba(0,0,0,0.5);
          backdrop-filter: blur(16px);
          box-sizing: border-box;
          overflow: hidden;
        }
        .initial-logo-box img {
          width: 100%;
          height: 100%;
          border-radius: 12px;
          object-fit: cover;
        }
        .initial-title {
          font-size: 24px;
          font-weight: 900;
          letter-spacing: -0.02em;
          color: #ffffff;
          margin: 0 0 4px 0;
        }
        .initial-subtitle {
          font-size: 12px;
          font-weight: 500;
          color: #94a3b8;
          letter-spacing: 0.02em;
          margin-bottom: 32px;
        }
        .initial-bar-track {
          width: 208px;
          height: 2px;
          background: rgba(30, 41, 59, 0.6);
          border-radius: 999px;
          overflow: hidden;
          position: relative;
          margin-bottom: 16px;
        }
        .initial-bar-fill {
          height: 100%;
          width: 25%;
          background: linear-gradient(90deg, #6366f1, #a855f7, #10b981);
          border-radius: 999px;
          box-shadow: 0 0 12px rgba(99, 102, 241, 0.6);
          animation: initial-bar-anim 1.5s ease-in-out infinite alternate;
        }
        .initial-status-text {
          font-size: 12px;
          font-weight: 400;
          color: #94a3b8;
          letter-spacing: 0.02em;
          height: 20px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .initial-footer {
          position: absolute;
          bottom: 28px;
          font-size: 10px;
          font-family: monospace;
          color: #475569;
          letter-spacing: 0.15em;
          text-transform: uppercase;
          z-index: 10;
          display: flex;
          align-items: center;
          gap: 12px;
        }
        @keyframes initial-bar-anim {
          0% { width: 15%; }
          100% { width: 45%; }
        }
      </style>
      <div class="initial-preloader-container">
        <div class="initial-aura"></div>
        <div class="initial-unit">
          <div class="initial-logo-wrapper">
            <div class="initial-logo-glow"></div>
            <div class="initial-logo-box">
              <img src="/favicon.jpg" alt="EduStride Logo" />
            </div>
          </div>
          <h1 class="initial-title">EduStride</h1>
          <div class="initial-subtitle">Enterprise ERP & LMS Portal</div>
          <div class="initial-bar-track">
            <div class="initial-bar-fill"></div>
          </div>
          <div class="initial-status-text">
            <span>Connecting secure gateway...</span>
          </div>
        </div>
        <div class="initial-footer">
          <span>EduStride Core</span>
          <span>•</span>
          <span>SSL Encrypted</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
