plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.edustride.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.edustride.app"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.2.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def ksProps = new Properties()
            def ksPropsFile = rootProject.file('keystore.properties')
            if (ksPropsFile.exists()) {
                ksPropsFile.withInputStream { ksProps.load(it) }
            }
            def ksPath = ksProps.getProperty('EDUSTRIDE_KEYSTORE_PATH') ?: project.findProperty('EDUSTRIDE_KEYSTORE_PATH') ?: System.getenv('EDUSTRIDE_KEYSTORE_PATH')
            def ksPassword = ksProps.getProperty('EDUSTRIDE_KEYSTORE_PASSWORD') ?: project.findProperty('EDUSTRIDE_KEYSTORE_PASSWORD') ?: System.getenv('EDUSTRIDE_KEYSTORE_PASSWORD')
            def keyAliasProp = ksProps.getProperty('EDUSTRIDE_KEY_ALIAS') ?: project.findProperty('EDUSTRIDE_KEY_ALIAS') ?: System.getenv('EDUSTRIDE_KEY_ALIAS')
            def keyPasswordProp = ksProps.getProperty('EDUSTRIDE_KEY_PASSWORD') ?: project.findProperty('EDUSTRIDE_KEY_PASSWORD') ?: System.getenv('EDUSTRIDE_KEY_PASSWORD')
            if (ksPath && ksPassword && keyAliasProp && keyPasswordProp) {
                def resolvedKs = new File(ksPath)
                if (!resolvedKs.isAbsolute()) {
                    resolvedKs = rootProject.file(ksPath)
                }
                storeFile resolvedKs
                storePassword ksPassword
                keyAlias keyAliasProp
                keyPassword keyPasswordProp
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Core SplashScreen API
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Socket.io for Real-time Background Notifications
    implementation ('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
